<div class="add-to-cart-dialog">
  <h2 mat-dialog-title>Ajouter au panier</h2>
  <div mat-dialog-content>
    <p><strong>{{ data?.product?.name ?? 'Produit' }}</strong></p>
    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Quantité</mat-label>
      <input matInput type="number" [formControl]="quantityCtrl" min="1" />
      <mat-error *ngIf="quantityCtrl.hasError('required')">Quantité requise</mat-error>
      <mat-error *ngIf="quantityCtrl.hasError('min')">Quantité minimale = 1</mat-error>
    </mat-form-field>
  </div>
  <div mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Annuler</button>
    <button mat-flat-button color="primary" (click)="confirm()">Ajouter</button>
  </div>
</div>
