<section class="store-product-cards">
  <!-- Toolbar -->
  <div class="store-product-cards__toolbar">
    <mat-form-field appearance="outline" class="store-product-cards__search">
      <mat-icon matPrefix style="color:#667eea;font-size:18px;margin-right:4px;margin-left:4px">search</mat-icon>
      <input matInput [formControl]="searchCtrl" placeholder="Tapez pour rechercher…" />
      <button
        mat-icon-button matSuffix type="button"
        (click)="searchCtrl.setValue('')"
        [disabled]="!searchCtrl.value"
      >
        <mat-icon style="font-size:16px">close</mat-icon>
      </button>
    </mat-form-field>

    <button mat-stroked-button class="store-product-cards__refresh" type="button" (click)="load()">
      <mat-icon>refresh</mat-icon>
      Rafraîchir
    </button>

    <button *ngIf="isAddable" mat-flat-button class="store-product-cards__add" type="button" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      Ajouter
    </button>
  </div>

  <!-- Filters -->
  <div class="store-product-cards__filters" *ngIf="filterControls.length">
    <mat-form-field
      *ngFor="let f of filterControls"
      appearance="outline"
      class="store-product-cards__filter"
    >
      <mat-label>{{ f.label }}</mat-label>

      <mat-select
        *ngIf="f.type === 'select'"
        [formControl]="getFilterCtrl(f.param)"
      >
        <mat-option [value]="null">Tous</mat-option>
        <mat-option *ngIf="isSelectOptionsLoading(f.param)" [disabled]="true">Chargement…</mat-option>
        <mat-option
          *ngFor="let opt of getSelectOptions(f.param, f.options)"
          [value]="opt.value"
        >
          {{ opt.label }}
        </mat-option>
      </mat-select>

      <input
        *ngIf="f.type === 'number'"
        matInput
        type="number"
        [placeholder]="f.placeholder || ''"
        [formControl]="getFilterCtrl(f.param)"
      />

      <input
        *ngIf="f.type === 'text'"
        matInput
        type="text"
        [placeholder]="f.placeholder || ''"
        [formControl]="getFilterCtrl(f.param)"
      />
    </mat-form-field>

    <button mat-stroked-button type="button" (click)="clearFilters()">
      <mat-icon>clear_all</mat-icon>
      Réinitialiser
    </button>
  </div>

  <!-- Loading -->
  <div class="store-product-cards__state" *ngIf="loading">Chargement en cours…</div>

  <!-- Error -->
  <div class="store-product-cards__state store-product-cards__state--error" *ngIf="error">
    <strong>Erreur :</strong>&nbsp;{{ error.message }}
  </div>

  <!-- Content -->
  <ng-container *ngIf="!loading && !error">
    <div class="store-product-cards__empty" *ngIf="items.length === 0">
      Aucun résultat trouvé.
    </div>

    <div class="store-product-cards__grid" *ngIf="items.length">
      <mat-card class="store-product-cards__card" *ngFor="let row of items; trackBy: trackById">

        <!-- Galerie images -->
        <ng-container *ngIf="imageField">
          <ng-container *ngIf="imageUrlsOf(row) as imgs">
            <div *ngIf="imgs.length > 0" class="store-product-cards__gallery">
              <div
                class="store-product-cards__gallery-main"
                [style.background-image]="'url(' + (getSelectedImageUrl(row) || imgs[0]) + ')'"
              ></div>

              <button
                *ngIf="isFavorisable"
                type="button"
                class="store-product-cards__fav"
                [class.store-product-cards__fav--active]="isFavoriteOf(row)"
                (click)="toggleFavorite(row, $event)"
                aria-label="Favori"
              >
                <mat-icon>{{ isFavoriteOf(row) ? 'favorite' : 'favorite_border' }}</mat-icon>
              </button>

              <div class="store-product-cards__gallery-thumbs" *ngIf="imgs.length > 1">
                <button
                  type="button"
                  class="store-product-cards__thumb"
                  *ngFor="let img of imgs"
                  [class.store-product-cards__thumb--active]="isSelectedImage(row, img) || (!getSelectedImageUrl(row) && img === imgs[0])"
                  (click)="selectImage(row, img)"
                  [style.background-image]="'url(' + img + ')'"
                  aria-label="Choisir l'image"
                ></button>
              </div>
            </div>

            <div *ngIf="imgs.length === 0" class="store-product-cards__card-img store-product-cards__card-img--placeholder"></div>
          </ng-container>
        </ng-container>

        <mat-card-header>
          <mat-card-title>{{ titleOf(row) }}</mat-card-title>

          <!-- Subtitle par défaut uniquement (sans priceTemplate) -->
          <mat-card-subtitle class="store-product-cards__price" *ngIf="!priceTemplate">
            {{ formatPrice(priceOf(row)) }}
          </mat-card-subtitle>
        </mat-card-header>

        <!-- Template prix custom HORS du header -->
        <ng-container *ngIf="priceTemplate">
          <div class="store-product-cards__card-price" *ngIf="priceTemplate">
            <ng-container
              [ngTemplateOutlet]="priceTemplate"
              [ngTemplateOutletContext]="priceContextOf(row)"
            ></ng-container>
          </div>
        </ng-container>

        <mat-card-actions align="end" *ngIf="isInfonable || isEditable || isDeletable">
          <button *ngIf="isInfonable" mat-icon-button type="button" matTooltip="Infos" (click)="info.emit(row)">
            <mat-icon>info_outline</mat-icon>
          </button>
          <button *ngIf="isEditable" mat-icon-button type="button" matTooltip="Modifier" (click)="edit.emit(row)">
            <mat-icon>edit_outline</mat-icon>
          </button>
          <button *ngIf="isDeletable" mat-icon-button type="button" matTooltip="Supprimer" (click)="delete.emit(row)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </mat-card-actions>

      </mat-card>
    </div>

    <mat-paginator
      [length]="pagination.total"
      [pageIndex]="pagination.page - 1"
      [pageSize]="pagination.limit"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPage($event)"
      aria-label="Pagination"
    ></mat-paginator>
  </ng-container>
</section>
