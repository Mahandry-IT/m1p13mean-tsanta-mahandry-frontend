<app-shell>
  <app-page headTitle="Liste des utilisateurs">
    <app-resource-list
      [endpoint]="'/users'"
      [itemsKey]="'users'"
      [columns]="columns"
      [resolves]="resolves"
      [isEditable]="true"
      [isDeletable]="true"
      [isInfonable]="true"
      [isAList]="false"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (info)="onInfo($event)"
    ></app-resource-list>
  </app-page>
</app-shell>
