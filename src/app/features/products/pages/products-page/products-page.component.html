<app-page headTitle="Produits">
  <app-resource-cards
    [endpoint]="endpoint"
    itemsKey="items"
    titleField="name"
    descriptionField="description"
    imageField="images"
    [enableServerSort]="true"
    [isInfonable]="true"
    [isEditable]="true"
    [isDeletable]="true"
    (info)="onInfo($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  ></app-resource-cards>
</app-page>
