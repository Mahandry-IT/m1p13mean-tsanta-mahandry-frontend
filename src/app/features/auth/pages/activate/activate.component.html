<app-page headTitle="Activation de compte">
  <section class="activate">
    <div class="activate__card">
      <div class="activate__icon">
        <mat-icon>mark_email_read</mat-icon>
      </div>

      <h1 class="activate__title">Activation de votre compte…</h1>
      <p class="activate__subtitle">Merci de patienter, nous confirmons votre adresse email.</p>

      <div class="activate__loader" *ngIf="(loading$ | async) ?? true">
        <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
      </div>

      <p class="activate__hint">
        Vous allez être redirigé automatiquement vers la page de connexion.
      </p>
    </div>
  </section>
</app-page>
