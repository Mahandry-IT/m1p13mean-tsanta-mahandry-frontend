<app-page headTitle="Changer votre mot de passe">
  <section class="reset-password">

    <div class="reset-password__form-panel">
      <div class="reset-password__card">

        <header class="reset-password__header">
          <div class="reset-password__icon">
            <mat-icon>vpn_key</mat-icon>
          </div>
          <h1 class="reset-password__title">Changer votre mot de passe</h1>
          <p class="reset-password__subtitle">Saisissez votre nouveau mot de passe pour sécuriser votre compte.</p>
        </header>

        <form class="reset-password__form" [formGroup]="form" (ngSubmit)="onSubmit()">

          <app-input
            name="email"
            label="Email"
            placeholder="ex: vous@example.com"
            type="email"
            autocomplete="email"
            [required]="true"
            [control]="form.controls.email"
          ></app-input>

          <!-- token caché : fourni par l'URL -->
          <input type="hidden" formControlName="token" />

          <app-input
            name="newPassword"
            label="Nouveau mot de passe"
            placeholder="Votre nouveau mot de passe"
            type="password"
            autocomplete="new-password"
            [required]="true"
            [control]="form.controls.newPassword"
          ></app-input>

          <app-input
            name="confirmPassword"
            label="Confirmer le mot de passe"
            placeholder="Retapez votre nouveau mot de passe"
            type="password"
            autocomplete="new-password"
            [required]="true"
            [control]="form.controls.confirmPassword"
          ></app-input>

          <p class="reset-password__error" *ngIf="form.hasError('passwordMismatch') && (form.dirty || form.touched)">
            Les mots de passe ne correspondent pas.
          </p>

          <div class="reset-password__actions">
            <app-button
              text="Changer le mot de passe"
              variant="raised"
              color="accent"
              type="submit"
              [fullWidth]="true"
              [loading]="loading"
              [isenabled]="(isEnabled$ | async) ?? false"
            ></app-button>
          </div>

          <div class="reset-password__login">
            <p>Retour</p>
            <a routerLink="/auth/login" class="reset-password__login-link">
              Se connecter
              <mat-icon>arrow_forward</mat-icon>
            </a>
          </div>

        </form>
      </div>
    </div>

  </section>
</app-page>
