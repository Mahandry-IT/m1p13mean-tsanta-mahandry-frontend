<app-page headTitle="Mot de passe oublié">
  <section class="forgot-password">

    <div class="forgot-password__form-panel">
      <div class="forgot-password__card">

        <header class="forgot-password__header">
          <div class="forgot-password__icon">
            <mat-icon>help_outline</mat-icon>
          </div>
          <h1 class="forgot-password__title">Mot de passe oublié</h1>
          <p class="forgot-password__subtitle">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        </header>

        <form class="forgot-password__form" [formGroup]="form" (ngSubmit)="onSubmit()">

          <app-input
            name="email"
            label="Email"
            placeholder="ex: vous@example.com"
            type="email"
            autocomplete="email"
            [required]="true"
            [control]="form.controls.email"
          ></app-input>

          <div class="forgot-password__actions">
            <app-button
              text="Envoyer le lien"
              variant="raised"
              color="accent"
              type="submit"
              [fullWidth]="true"
              [loading]="loading"
              [isenabled]="(isEnabled$ | async) ?? false"
            ></app-button>
          </div>

          <div class="forgot-password__login">
            <a routerLink="/auth/login">Retour à la connexion</a>
          </div>

        </form>
      </div>
    </div>

  </section>
</app-page>
