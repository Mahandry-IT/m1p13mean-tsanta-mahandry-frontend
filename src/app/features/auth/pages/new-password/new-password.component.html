<app-page headTitle="Nouveau mot de passe">
  <section class="new-password">

    <div class="new-password__form-panel">
      <div class="new-password__card">

        <header class="new-password__header">
          <div class="new-password__icon">
            <mat-icon>lock_reset</mat-icon>
          </div>
          <h1 class="new-password__title">Définir un nouveau mot de passe</h1>
          <p class="new-password__subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>
        </header>

        <form class="new-password__form" [formGroup]="form" (ngSubmit)="onSubmit()">

          <!-- email visible (pré-rempli par l'URL) -->
          <app-input
            name="email"
            label="Email"
            placeholder="ex: vous@example.com"
            type="email"
            autocomplete="email"
            [required]="true"
            [control]="form.controls.email"
          ></app-input>

          <!-- token caché : fourni par l'URL -->
          <input type="hidden" formControlName="token" />

          <app-input
            name="newPassword"
            label="Nouveau mot de passe"
            placeholder="Votre nouveau mot de passe"
            type="password"
            autocomplete="new-password"
            [required]="true"
            [control]="form.controls.newPassword"
          ></app-input>

          <app-input
            name="confirmPassword"
            label="Confirmer le mot de passe"
            placeholder="Retapez votre nouveau mot de passe"
            type="password"
            autocomplete="new-password"
            [required]="true"
            [control]="form.controls.confirmPassword"
          ></app-input>

          <p class="new-password__error" *ngIf="form.hasError('passwordMismatch') && (form.dirty || form.touched)">
            Les mots de passe ne correspondent pas.
          </p>

          <div class="new-password__actions">
            <app-button
              text="Mettre à jour mon mot de passe"
              variant="raised"
              color="accent"
              type="submit"
              [fullWidth]="true"
              [loading]="loading"
              [isenabled]="(isEnabled$ | async) ?? false"
            ></app-button>
          </div>

          <div class="new-password__login">
            <p>Vous vous souvenez de votre mot de passe ?</p>
            <a routerLink="/auth/login" class="new-password__login-link">
              Se connecter
              <mat-icon>arrow_forward</mat-icon>
            </a>
          </div>

        </form>
      </div>
    </div>

  </section>
</app-page>
