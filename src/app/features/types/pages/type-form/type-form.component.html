<div class="dialog">
  <div class="dialog__header">
    <div class="dialog__icon">
      <mat-icon>{{ isInfo ? 'sell' : (isCreate ? 'add_circle_outline' : 'edit_outline') }}</mat-icon>
    </div>
    <div class="dialog__titles">
      <h2>{{ isInfo ? 'Infos type' : (isCreate ? 'Ajouter type' : 'Modifier type') }}</h2>
      <p>{{ isInfo ? 'Détails du type' : 'Renseignez les informations ci-dessous' }}</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog__body">
    <div class="field">
      <label>Nom</label>
      <div class="field__wrap" [class.field__wrap--disabled]="isInfo">
        <input formControlName="name" placeholder="ex: PC" />
      </div>
      <div class="field__error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Nom requis</div>
    </div>

    <div class="field">
      <label>Slug</label>
      <div class="field__wrap" [class.field__wrap--disabled]="isInfo">
        <input formControlName="slug" placeholder="ex: pc" />
      </div>
    </div>

    <div class="field">
      <label>Catégorie</label>
      <div class="field__wrap" [class.field__wrap--disabled]="isInfo">
        <mat-select formControlName="categoryId" [disabled]="isInfo" placeholder="Sélectionner une catégorie">
          <mat-option *ngFor="let c of categoryOptions" [value]="c.id">{{ c.label }}</mat-option>
        </mat-select>
      </div>
      <div class="field__error" *ngIf="form.get('categoryId')?.touched && form.get('categoryId')?.invalid">Catégorie requise</div>
    </div>

    <div class="dialog__actions">
      <button type="button" class="btn btn--cancel" (click)="close()">Fermer</button>
      <button *ngIf="!isInfo" type="submit" class="btn btn--submit">
        <mat-icon>save_outlined</mat-icon>
        Enregistrer
      </button>
    </div>
  </form>
</div>
